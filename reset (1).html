h1{margin:0;text-align:center;font-family:'Baloo 2',cursive;font-size:30px;line-height:1;color:#fff}
.sub{margin:2px auto 18px;text-align:center;color:rgba(211,242,252,.68);font-size:11px;line-height:1.5}
.status{margin:0 0 14px;padding:10px 11px;border-radius:13px;font-size:10px;line-height:1.45;background:rgba(1,19,37,.46);border:1px solid rgba(125,222,255,.13);color:#bdeaf7}
.status.ok{color:#7df3bb;border-color:rgba(105,241,184,.28);background:rgba(5,60,49,.32)}.status.err{color:#ffb2c3;border-color:rgba(255,113,150,.28);background:rgba(81,20,39,.32)}
.form{display:grid;gap:10px}label{display:block;margin:0 0 5px 2px;font-size:9px;font-weight:800;letter-spacing:.11em;color:rgba(190,230,246,.72)}
input{width:100%;padding:13px 12px;border-radius:14px;border:1px solid rgba(125,222,255,.22);background:rgba(0,15,31,.64);color:#effcff;outline:none;font:600 13px Outfit,sans-serif}input:focus{border-color:rgba(112,239,255,.68);box-shadow:0 0 0 3px rgba(82,224,255,.08)}
.rules{padding:10px 11px;border-radius:13px;background:rgba(3,19,36,.44);border:1px solid rgba(126,216,244,.10);font-size:9px;color:rgba(199,233,244,.60);line-height:1.5}
.btn{width:100%;margin-top:2px;border:0;border-radius:15px;padding:13px 12px;cursor:pointer;font:800 11px Outfit,sans-serif;letter-spacing:.08em;color:#08243a;background:linear-gradient(180deg,#d2fcff,#59e1eb);box-shadow:0 5px 0 rgba(4,91,108,.58),inset 0 2px 0 rgba(255,255,255,.62)}.btn:disabled{opacity:.55;cursor:not-allowed}
.back{display:block;margin:13px auto 0;text-align:center;color:rgba(209,242,250,.66);font-size:10px;text-decoration:none}
.shake{animation:shake .28s ease}@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}

<body>
<div class="bubbles" id="bubbles"></div>
<div class="wrap">
  <main class="card" id="card">
    <div class="logo" aria-label="Coral Cash"></div>
    <h1>Crea tu nueva contraseña</h1>
    <div class="sub">Tu enlace de recuperación se está verificando de forma segura.</div>
    <div class="status" id="status">⏳ Validando enlace de recuperación…</div>
    <form class="form" id="form" hidden>
      <div><label>NUEVA CONTRASEÑA</label><input id="p1" type="password" autocomplete="new-password" minlength="8" placeholder="Nueva contraseña"></div>
      <div><label>CONFIRMAR CONTRASEÑA</label><input id="p2" type="password" autocomplete="new-password" minlength="8" placeholder="Repite la contraseña"></div>
      <div class="rules">Mínimo 8 caracteres, con mayúscula, minúscula, número y símbolo.</div>
      <button class="btn" id="save" type="submit">GUARDAR NUEVA CONTRASEÑA</button>
    </form>
    <a class="back" href="./">Volver a Coral Cash</a>
  </main>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL='https://wuzjifgwhhjyxlxgduwp.supabase.co';
const SUPABASE_KEY='sb_publishable_Zug-PGTtE2qVzFuxTgMiGQ_6J_5WOph';
const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{persistSession:false,autoRefreshToken:false,detectSessionInUrl:true}});
const statusEl=document.getElementById('status');
const form=document.getElementById('form');
let recoveryReady=false;
function setStatus(t,k=''){statusEl.className='status '+k;statusEl.textContent=t}
function passwordValid(p){return p.length>=8&&/[A-Z]/.test(p)&&/[a-z]/.test(p)&&/[0-9]/.test(p)&&/[^A-Za-z0-9]/.test(p)}
function ready(){recoveryReady=true;form.hidden=false;setStatus('✅ Enlace verificado. Escribe tu nueva contraseña.','ok')}
function bubbles(){const box=document.getElementById('bubbles');for(let i=0;i<34;i++){const b=document.createElement('span');b.className='bubble';b.style.left=(Math.random()*100)+'%';b.style.setProperty('--s',(8+Math.random()*34)+'px');b.style.setProperty('--o',(0.18+Math.random()*0.52).toFixed(2));b.style.setProperty('--d',(6+Math.random()*9)+'s');b.style.setProperty('--delay',(-Math.random()*12)+'s');b.style.setProperty('--drift',(-35+Math.random()*70)+'px');box.appendChild(b)}}
bubbles();
let eventSaw=false;
sb.auth.onAuthStateChange((event,session)=>{if(event==='PASSWORD_RECOVERY'||(event==='SIGNED_IN'&&session)){eventSaw=true;ready()}});
(async()=>{
  try{
    const url=new URL(location.href);
    const code=url.searchParams.get('code');
    if(code){
      const {data,error}=await sb.auth.exchangeCodeForSession(code);
      if(error) throw error;
      if(data?.session) ready();
    }
    const hash=new URLSearchParams((location.hash||'').replace(/^#/,''));
    const at=hash.get('access_token'), rt=hash.get('refresh_token');
    if(!recoveryReady && at && rt){
      const {data,error}=await sb.auth.setSession({access_token:at,refresh_token:rt});
      if(error) throw error;
      if(data?.session) ready();
    }
    await new Promise(r=>setTimeout(r,550));
    if(!recoveryReady){
      const {data}=await sb.auth.getSession();
      if(data?.session) ready();
    }
    if(!recoveryReady) setStatus('❌ Este enlace no pudo validarse o ya expiró. Solicita uno nuevo desde Coral Cash.','err');
  }catch(e){setStatus('❌ Este enlace no pudo validarse o ya expiró. Solicita uno nuevo desde Coral Cash.','err')}
})();
form.addEventListener('submit',async(e)=>{
  e.preventDefault();
  if(!recoveryReady) return;
  const p1=document.getElementById('p1').value||'', p2=document.getElementById('p2').value||'';
  if(!passwordValid(p1)){setStatus('❌ La contraseña no cumple los requisitos.','err');document.getElementById('card').classList.add('shake');setTimeout(()=>document.getElementById('card').classList.remove('shake'),320);return}
  if(p1!==p2){setStatus('❌ Las contraseñas no coinciden.','err');return}
  const btn=document.getElementById('save');btn.disabled=true;btn.textContent='GUARDANDO…';
  try{
    const {error}=await sb.auth.updateUser({password:p1});
    if(error) throw error;
    setStatus('✅ Contraseña cambiada correctamente. Ya puedes iniciar sesión.','ok');
    form.hidden=true;
    try{await sb.auth.signOut()}catch(_e){}
    setTimeout(()=>location.href='./',1700);
  }catch(e){setStatus('❌ No se pudo cambiar la contraseña. Solicita un enlace nuevo e inténtalo otra vez.','err');btn.disabled=false;btn.textContent='GUARDAR NUEVA CONTRASEÑA'}
});
</script>
